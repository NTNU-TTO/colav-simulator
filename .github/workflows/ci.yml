name: CI

env:
  UV_LINK_MODE: copy

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.12.0-amd64
    steps:
      - name: Install git and git-lfs
        run: |
          apt-get update
          apt-get install -y git git-lfs
          git lfs install
      
      - uses: actions/checkout@v5
      
      - uses: ./.github/setup-colav-simulator
      
      - name: Run formatting and linting checks
        run: uv run ruff check .
  
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.12.0-amd64
    
    steps:
      - name: Install git and git-lfs
        run: |
          apt-get update
          apt-get install -y git git-lfs
          git lfs install
      
      - uses: actions/checkout@v5
        with:
          lfs: true
      
      - uses: ./.github/setup-colav-simulator
      
      - name: Run pytest
        run: uv run pytest -v tests