name: 'Setup Python Environment'
description: 'Common setup steps for CI jobs'

runs:
  using: 'composite'
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        apt-get update
        apt-get install -y build-essential g++ python3-dev python3-tk ffmpeg libsm6 libxext6
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

